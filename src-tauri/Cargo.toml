[package]
name = "ets2-coach-volume"
version = "1.0.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
flate2 = "1"
zip = { version = "2", default-features = false }
sha1 = "0.10"
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
strip = true
